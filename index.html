<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HealthPulse</title>
  <meta name="description" content="Upload health reports, get AI-personalized workout plans, meal plans with recipes, and track your health markers.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151B24" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HealthPulse">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    html{-webkit-text-size-adjust:100%}
    img{max-width:100%}
    [hidden]{display:none!important}
  </style>
  <style>
:root{
  --ground:#F0F2F8;
  --surface:#FFFFFF;
  --surface-2:#E8EBF4;
  --surface-3:#D8DCEB;
  --line:#CBD1E3;
  --line-soft:#DDE1EF;
  --ink:#0F1623;
  --ink-2:#4D5A72;
  --ink-3:#8291A8;
  --accent:#4361EE;
  --accent-2:#7048E8;
  --accent-ink:#FFFFFF;
  --accent-soft:#EBF0FF;
  --accent-line:#B8C6FA;
  --good:#0D9F6E;
  --good-soft:#D8F5EC;
  --warn:#C47D0E;
  --warn-soft:#FEF3D8;
  --bad:#D63B2F;
  --bad-soft:#FDEAE8;
  --shadow:0 1px 3px rgba(15,22,35,.07),0 4px 16px -4px rgba(67,97,238,.12);
  --shadow-lg:0 2px 8px rgba(15,22,35,.08),0 12px 40px -8px rgba(67,97,238,.18);
  --r:12px;
  color-scheme:light;
}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#080C14;
    --surface:#0F1624;
    --surface-2:#172035;
    --surface-3:#1F2C44;
    --line:#243350;
    --line-soft:#182238;
    --ink:#E2E8F8;
    --ink-2:#8DA0BF;
    --ink-3:#5A6F8A;
    --accent:#7B96FF;
    --accent-2:#9B7AFF;
    --accent-ink:#080C14;
    --accent-soft:#131D3A;
    --accent-line:#263A6B;
    --good:#3DC995;
    --good-soft:#0B2820;
    --warn:#FFBD4F;
    --warn-soft:#2A1D08;
    --bad:#FF6F66;
    --bad-soft:#2D1010;
    --shadow:0 1px 3px rgba(0,0,0,.5),0 8px 28px -8px rgba(0,0,0,.8);
    --shadow-lg:0 2px 8px rgba(0,0,0,.5),0 16px 48px -12px rgba(0,0,0,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#080C14;
  --surface:#0F1624;
  --surface-2:#172035;
  --surface-3:#1F2C44;
  --line:#243350;
  --line-soft:#182238;
  --ink:#E2E8F8;
  --ink-2:#8DA0BF;
  --ink-3:#5A6F8A;
  --accent:#7B96FF;
  --accent-2:#9B7AFF;
  --accent-ink:#080C14;
  --accent-soft:#131D3A;
  --accent-line:#263A6B;
  --good:#3DC995;
  --good-soft:#0B2820;
  --warn:#FFBD4F;
  --warn-soft:#2A1D08;
  --bad:#FF6F66;
  --bad-soft:#2D1010;
  --shadow:0 1px 3px rgba(0,0,0,.5),0 8px 28px -8px rgba(0,0,0,.8);
  --shadow-lg:0 2px 8px rgba(0,0,0,.5),0 16px 48px -12px rgba(0,0,0,.9);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;
  padding-bottom:84px;
}
h1,h2,h3,h4{font-family:Archivo,"IBM Plex Sans",sans-serif;margin:0;text-wrap:balance;letter-spacing:-.022em;line-height:1.15}
h1{font-size:28px;font-weight:800}
h2{font-size:19px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---- tick rule ---- */
.rule{height:9px;width:100%;
  background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px 8px);
  background-position:bottom left;background-repeat:repeat-x;background-size:8px 5px;
  border-bottom:1px solid var(--line);opacity:.7}
.rule.major{background-image:repeating-linear-gradient(to right,var(--accent-line) 0 1px,transparent 1px 8px)}

.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500}

/* ---- app bar ---- */
header.bar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--surface) 85%,transparent);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--line-soft);
}
.bar-in{max-width:760px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:12px}
.mark{
  width:32px;height:32px;flex:none;border-radius:9px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;
  box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 40%,transparent);
}
.mark svg{display:block}
.brand{font-family:Archivo,sans-serif;font-weight:800;font-size:17px;letter-spacing:-.025em;line-height:1}
.brand small{display:block;font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.bar-sp{flex:1}
.icon-btn{
  width:36px;height:36px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface-2);
  display:grid;place-items:center;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.icon-btn:hover{background:var(--surface-3);border-color:var(--line)}

/* ---- bottom nav ---- */
nav.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:45;
  background:color-mix(in srgb,var(--surface) 90%,transparent);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-top:1px solid var(--line-soft);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 8px}
.tab{
  appearance:none;border:0;background:none;
  padding:6px 4px 7px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--ink-3);border-radius:10px;
  transition:color .15s,background .15s;
}
.tab span{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.07em;text-transform:uppercase;font-weight:500}
.tab[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.tab svg{display:block}

main{padding-top:20px}
section.view{display:none;animation:fade .2s ease}
section.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---- cards ---- */
.card{
  background:var(--surface);
  border:1px solid var(--line-soft);
  border-radius:var(--r);
  box-shadow:var(--shadow);
}
.card + .card{margin-top:14px}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:620px){.grid2{grid-template-columns:repeat(2,1fr)}.grid4{grid-template-columns:repeat(4,1fr)}}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.muted{color:var(--ink-2)}
.tiny{font-size:12.5px;line-height:1.5}
.xtiny{font-size:11.5px;line-height:1.45}

/* ---- controls ---- */
label.f{display:flex;flex-direction:column;gap:6px}
label.f > .lb{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
input[type=text],input[type=number],select,textarea{
  width:100%;padding:10px 12px;
  background:var(--surface-2);
  border:1.5px solid var(--line);
  border-radius:9px;
  font-family:"IBM Plex Mono",monospace;font-size:14px;
  transition:border-color .15s,background .15s;
}
input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{
  border-color:var(--accent);background:var(--surface);outline:none;
}
textarea{font-family:"IBM Plex Sans",sans-serif;resize:vertical}
select{font-family:"IBM Plex Sans",sans-serif;cursor:pointer}
.btn{
  appearance:none;
  border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:var(--accent-ink);
  padding:11px 18px;border-radius:10px;
  font-weight:700;font-size:14px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 35%,transparent);
  transition:filter .15s,box-shadow .15s,transform .1s;
}
.btn:hover{filter:brightness(1.1);box-shadow:0 4px 16px color-mix(in srgb,var(--accent) 45%,transparent)}
.btn:active{transform:scale(.98)}
.btn.ghost{
  background:var(--surface-2);color:var(--ink);
  border:1.5px solid var(--line);
  box-shadow:none;
}
.btn.ghost:hover{background:var(--surface-3);border-color:var(--ink-3)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  appearance:none;
  border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink-2);
  padding:6px 13px;border-radius:999px;font-size:12.5px;cursor:pointer;white-space:nowrap;
  transition:all .15s;font-weight:500;
}
.chip:hover{border-color:var(--accent-line);color:var(--accent)}
.chip[aria-pressed="true"]{
  background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,var(--accent-2) 10%,var(--accent-soft)));
  border-color:var(--accent-line);color:var(--accent);font-weight:700;
}
.pill{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 9px;border-radius:999px;
  font-size:11px;font-weight:700;
  font-family:"IBM Plex Mono",monospace;letter-spacing:.03em;
  border:1px solid transparent;
}
.pill.good{background:var(--good-soft);color:var(--good);border-color:color-mix(in srgb,var(--good) 25%,transparent)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 25%,transparent)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}

/* ---- stat tiles ---- */
.tile{
  background:var(--surface);
  border:1px solid var(--line-soft);
  border-radius:var(--r);
  padding:14px;
  display:flex;flex-direction:column;gap:3px;min-width:0;
  position:relative;overflow:hidden;
}
.tile::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  border-radius:var(--r) var(--r) 0 0;
}
.tile .k{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.tile .v{font-family:Archivo,sans-serif;font-weight:800;font-size:26px;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px}
.tile .v small{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:0}
.tile .s{font-size:11.5px;color:var(--ink-2);margin-top:1px}

/* ---- meters ---- */
.meter{height:8px;background:var(--surface-3);border-radius:999px;overflow:hidden;position:relative}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:999px}
.meter i.good{background:linear-gradient(90deg,var(--good),color-mix(in srgb,var(--good) 70%,#50FA7B))}
.meter i.warn{background:linear-gradient(90deg,var(--warn),color-mix(in srgb,var(--warn) 70%,#FFD700))}
.meter i.bad{background:linear-gradient(90deg,var(--bad),color-mix(in srgb,var(--bad) 70%,#FF8B82))}
.vol-row{display:grid;grid-template-columns:80px 1fr 60px;align-items:center;gap:10px;padding:6px 0}
.vol-row + .vol-row{border-top:1px solid var(--line-soft)}

/* ---- exercise list ---- */
.ex{border-top:1px solid var(--line-soft);padding:12px 0}
.ex:first-child{border-top:0}
.ex-h{display:flex;gap:10px;align-items:flex-start}
.ex-n{font-weight:700;font-size:14.5px;line-height:1.3}
.ex-i{
  width:26px;height:26px;flex:none;border-radius:7px;
  background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,var(--accent-2) 8%,var(--accent-soft)));
  border:1px solid var(--accent-line);
  color:var(--accent);
  display:grid;place-items:center;
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:700;margin-top:1px;
}
.ex-meta{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-2);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.ex-cue{font-size:12.5px;color:var(--ink-2);margin-top:6px;padding-left:36px;line-height:1.5}

/* ---- set logger ---- */
.setgrid{display:grid;grid-template-columns:24px 1fr 1fr 38px;gap:7px;align-items:center;margin-top:7px}
.setgrid input{padding:8px 8px;text-align:center;font-size:13.5px;border-radius:8px}
.setgrid .sn{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);text-align:center}
.tick{
  appearance:none;width:38px;height:38px;
  border:1.5px solid var(--line);background:var(--surface-2);
  border-radius:9px;cursor:pointer;display:grid;place-items:center;
  color:var(--ink-3);transition:all .15s;
}
.tick:hover{border-color:var(--good);color:var(--good)}
.tick[aria-pressed="true"]{
  background:linear-gradient(135deg,var(--good),color-mix(in srgb,var(--good) 70%,#50FA7B));
  border-color:var(--good);color:#fff;
  box-shadow:0 2px 8px color-mix(in srgb,var(--good) 35%,transparent);
}

/* ---- photo analyser ---- */
.stage{
  position:relative;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;touch-action:none;width:fit-content;max-width:100%;margin:0 auto;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  box-shadow:var(--shadow);
}
.stage img{display:block;width:auto;height:auto;max-width:100%;max-height:52vh;pointer-events:none}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.hnd{cursor:grab}
.drop{
  border:2px dashed var(--line);border-radius:var(--r);
  padding:32px 20px;text-align:center;background:var(--surface-2);
  transition:border-color .15s,background .15s;
}
.drop:hover{border-color:var(--accent-line);background:var(--accent-soft)}

/* ---- meals ---- */
.meal{border-top:1px solid var(--line-soft);padding:13px 0}
.meal:first-child{border-top:0}
.food{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:13px;padding:3px 0;color:var(--ink-2)}
.food b{color:var(--ink);font-weight:600}

/* ---- feed ---- */
.post{border-top:1px solid var(--line-soft);padding:14px 0}
.post:first-child{border-top:0}
.av{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,var(--accent-2) 12%,var(--accent-soft)));
  border:1px solid var(--accent-line);
  color:var(--accent);display:grid;place-items:center;
  font-family:Archivo,sans-serif;font-weight:800;font-size:13px;flex:none;
}
.empty{text-align:center;padding:28px 16px;color:var(--ink-2)}

table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:left;font-weight:600;padding:7px 9px;border-bottom:2px solid var(--line)}
table.data td{padding:8px 9px;border-bottom:1px solid var(--line-soft);font-variant-numeric:tabular-nums}
table.data tr:hover td{background:var(--surface-2)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

.note{
  background:var(--accent-soft);
  border-left:3px solid var(--accent);
  padding:10px 13px;border-radius:0 10px 10px 0;
  font-size:12.5px;color:var(--ink-2);
}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:60;
  background:linear-gradient(135deg,var(--ink),color-mix(in srgb,var(--ink) 80%,var(--accent)));
  color:var(--ground);
  padding:10px 18px;border-radius:12px;
  font-size:13px;font-weight:600;
  box-shadow:var(--shadow-lg);
  opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;
  white-space:nowrap;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-5px)}
dialog{
  border:1px solid var(--line);border-radius:16px;
  background:var(--surface);color:var(--ink);
  padding:0;max-width:min(560px,94vw);width:100%;
  box-shadow:var(--shadow-lg);
}
dialog::backdrop{background:rgba(8,12,20,.6);backdrop-filter:blur(4px)}
.dlg-h{
  display:flex;align-items:center;justify-content:space-between;
  padding:15px 16px;border-bottom:1px solid var(--line-soft);
}
.dlg-b{padding:16px;max-height:min(70vh,580px);overflow:auto}

/* ---- AI coach ---- */
.ai-card{background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,var(--accent-2) 8%,var(--accent-soft)));border:1px solid var(--accent-line);border-radius:var(--r);padding:16px}
.ai-badge{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);padding:3px 11px 3px 9px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.06em;font-family:"IBM Plex Mono",monospace;box-shadow:0 2px 6px color-mix(in srgb,var(--accent) 35%,transparent)}
.ai-list-item{display:flex;gap:7px;padding:4px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px;line-height:1.5}
.ai-list-item:last-child{border-bottom:0}
.ai-spin{display:inline-block;width:14px;height:14px;border:2px solid var(--accent-line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex:none;margin-top:1px}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---- lab results ---- */
.lab-row{display:grid;grid-template-columns:1fr 80px 110px 52px;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
.lab-row:last-child{border-bottom:0}
.lab-val{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-weight:600}
.lab-row.high .lab-val{color:var(--bad)}
.lab-row.low .lab-val{color:var(--warn)}
.lab-row.normal .lab-val{color:var(--good)}
/* ---- AI chat interface ---- */
.chat-thread{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;max-height:420px;overflow-y:auto;padding:2px 0}
.chat-bubble{padding:10px 13px;border-radius:16px;font-size:13px;line-height:1.55}
.chat-bubble.ai{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px;width:100%}
.chat-bubble.user{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);border-bottom-right-radius:4px;max-width:80%}
.chat-input-row{display:flex;gap:8px;align-items:stretch;margin-bottom:6px}
.chat-input-row .field{flex:1}
.guidance-result{margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft)}
.warn-note{border-color:var(--warn)!important;background:var(--warn-soft)!important}
.lab-loading{display:flex;align-items:center;gap:8px;padding:8px 0}

/* ---- floating AI chat ---- */
.fab-chat{
  position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));right:16px;z-index:50;
  width:52px;height:52px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);
  box-shadow:0 4px 16px color-mix(in srgb,var(--accent) 45%,transparent);
  cursor:pointer;display:grid;place-items:center;
  transition:transform .15s,box-shadow .15s;
}
.fab-chat:hover{transform:scale(1.08);box-shadow:0 6px 24px color-mix(in srgb,var(--accent) 55%,transparent)}
.fab-chat:active{transform:scale(.95)}
.fab-chat-panel{
  position:fixed;bottom:calc(130px + env(safe-area-inset-bottom));right:16px;z-index:55;
  width:calc(100vw - 32px);max-width:380px;max-height:60vh;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;
}
.fab-chat-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line-soft)}
.fab-chat-thread{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-height:120px;max-height:40vh}
.fab-chat-input{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line-soft)}
.fab-chat-input input{flex:1;padding:8px 12px;background:var(--surface-2);border:1.5px solid var(--line);border-radius:9px;font-size:13px}
.fab-chat-input input:focus{border-color:var(--accent);background:var(--surface);outline:none}

/* ---- onboarding ---- */
.onboard-step{display:flex;flex-direction:column;gap:16px}
.upload-zone{
  border:2px dashed var(--line);border-radius:var(--r);padding:32px 20px;
  text-align:center;cursor:pointer;transition:border-color .15s,background .15s;
}
.upload-zone:hover{border-color:var(--accent);background:var(--accent-soft)}

/* ---- health markers ---- */
.marker-group{margin-bottom:16px}
.marker-group-head{font-family:Archivo,sans-serif;font-weight:700;font-size:14px;margin-bottom:8px;color:var(--ink)}
.marker-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.marker-name{font-size:13px;flex:1}
.marker-val{font-family:"IBM Plex Mono",monospace;font-size:13px;min-width:80px;text-align:right}

/* ---- recipe cards ---- */
.recipe-card{border:1px solid var(--line-soft);border-radius:var(--r);padding:14px;margin-top:10px}
.recipe-steps{font-size:13px;line-height:1.6;color:var(--ink-2)}
.recipe-steps ol{margin:8px 0 0 18px;padding:0}
.recipe-steps li{margin-bottom:4px}
.recipe-meta{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.recipe-meta span{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}
</style>
</head>

/* ============================================================
   Engine — body metrics
   ============================================================ */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r1=v=>Math.round(v*10)/10;
const r2=v=>Math.round(v*100)/100;
const log10=Math.log10;

function navyBF(sex,heightCm,neckCm,waistCm,hipCm){
  if(!heightCm||!neckCm||!waistCm) return null;
  /* Hodgdon-Beckett / Siri form — this variant takes centimetres directly */
  const h=heightCm, nk=neckCm, w=waistCm, hp=hipCm||0;
  let bf;
  if(sex==='female'){
    if(!hipCm) return null;
    const d=w+hp-nk; if(d<=0) return null;
    bf=495/(1.29579-0.35004*log10(d)+0.22100*log10(h))-450;
  }else{
    const d=w-nk; if(d<=0) return null;
    bf=495/(1.0324-0.19077*log10(d)+0.15456*log10(h))-450;
  }
  return (bf>2&&bf<70)?r1(bf):null;
}
function ffmi(weightKg,heightCm,bf){
  if(!weightKg||!heightCm||bf==null) return null;
  const m=heightCm/100, lbm=weightKg*(1-bf/100);
  const raw=lbm/(m*m);
  return {raw:r1(raw), norm:r1(raw+6.1*(1.8-m)), lbm:r1(lbm)};
}
function bfBand(sex,bf){
  const m=[[6,'Contest-lean','warn'],[11,'Very lean','good'],[15,'Athletic','good'],[20,'Fit','good'],[25,'Average','warn'],[100,'High','bad']];
  const f=[[14,'Contest-lean','warn'],[18,'Very lean','good'],[23,'Athletic','good'],[28,'Fit','good'],[33,'Average','warn'],[100,'High','bad']];
  const t=sex==='female'?f:m;
  for(const [c,l,k] of t) if(bf<c) return {label:l,kind:k};
  return {label:'High',kind:'bad'};
}
function ffmiBand(sex,norm){
  const off=sex==='female'?-4.5:0, v=norm-off;
  if(v<18) return {label:'Below average lean mass',kind:'warn'};
  if(v<20) return {label:'Average lean mass',kind:'neutral'};
  if(v<22) return {label:'Well-trained',kind:'good'};
  if(v<25) return {label:'Advanced',kind:'good'};
  return {label:'Exceptional (or measurement error)',kind:'warn'};
}
/* Mifflin-St Jeor */
function bmr(sex,w,h,a){ return sex==='female' ? 10*w+6.25*h-5*a-161 : 10*w+6.25*h-5*a+5; }
function activityFactor(p){
  const base={desk:1.2,moderate:1.35,onfeet:1.5}[p.activity||'desk'];
  return base + 0.025*(p.days||3);
}
function nutritionTargets(p,bf){
  const w=p.weightKg, h=p.heightCm, a=p.age||25;
  const tdee=Math.round(bmr(p.sex,w,h,a)*activityFactor(p));
  const adj={cut:-0.20,recomp:-0.08,muscle:0.10,strength:0.06}[p.goal]??0;
  let kcal=Math.round(tdee*(1+adj));
  kcal=Math.max(kcal, Math.round(bmr(p.sex,w,h,a)*1.05));
  const highBf = bf!=null && bf > (p.sex==='female'?32:25);
  const lbm = highBf ? w*(1-bf/100) : null;
  const gk={cut:2.2,recomp:2.0,muscle:1.8,strength:1.8}[p.goal]??1.8;
  let prot=Math.round(highBf ? lbm*2.4 : w*gk);
  prot=clamp(prot,Math.round(w*1.4),Math.round(w*2.6));
  let fat=Math.round(Math.max(w*0.7,(kcal*0.22)/9));
  let carb=Math.round((kcal-prot*4-fat*9)/4);
  if(carb<60){ carb=60; fat=Math.round((kcal-prot*4-carb*4)/9); }
  return {tdee,kcal,protein:prot,fat,carb,adj};
}

const DAY_NAMES={push:'Push',pull:'Pull',legs:'Legs',upperA:'Upper body A',upperB:'Upper body B',
  lowerA:'Lower body A',lowerB:'Lower body B',fullA:'Full body A',fullB:'Full body B',fullC:'Full body C'};
function weekShape(days,exp){
  if(days<=2) return ['fullA','fullB'];
  if(days===3) return exp==='beginner'?['fullA','fullB','fullC']:['push','pull','legs'];
  if(days===4) return ['upperA','lowerA','upperB','lowerB'];
  if(days===5) return ['push','pull','legs','upperA','lowerA'];
  return ['push','pull','legs','push','pull','legs'];
}
const SETS_BY_EXP={beginner:{1:3,2:3,3:2},intermediate:{1:4,2:3,3:3},advanced:{1:4,2:4,3:3}};
const REST={1:180,2:120,3:75};
const RIR={1:2,2:2,3:1};

function pickExercise(muscle,tier,equip,used,dayUsed,seed){
  const pool=EX.filter(e=>e.m===muscle&&equip.includes(e.e)&&!dayUsed.has(e.id));
  if(!pool.length) return null;                       /* never repeat a lift in one session */
  const exact=pool.filter(e=>e.t===tier);
  const near=pool.filter(e=>Math.abs(e.t-tier)===1);
  for(const list of [exact,near,pool]){
    const fresh=list.filter(e=>!used.has(e.id));      /* prefer variety across the week */
    if(fresh.length) return fresh[seed%fresh.length];
  }
  return pool[seed%pool.length];
}
function buildPlan(p,priorities){
  const equip=EQUIP_SETS[p.equipment||'full'];
  const exp=p.experience||'beginner';
  const freq=p.days||3;
  const shape=weekShape(freq,exp);
  const setsMap=SETS_BY_EXP[exp];
  const used=new Set(); let seed=(p.planSeed||0);
  const days=shape.map((type,di)=>{
    let slots=DAY_SLOTS[type].slice();
    priorities.forEach(m=>{
      const n=slots.filter(s=>s[0]===m).length;
      if(n>0&&n<2) slots.push([m,3]);                 /* one extra slot, never a third */
    });
    if(slots.length>8) slots=slots.slice(0,8);
    const dayUsed=new Set();
    const blocks=slots.map((s,si)=>{
      const [muscle,tier]=s;
      const ex=pickExercise(muscle,tier,equip,used,dayUsed,seed+si+di*3);
      if(!ex) return null;
      used.add(ex.id); dayUsed.add(ex.id);
      let sets=setsMap[ex.t]||3;
      /* small muscles only get one slot a session, so the slot carries more sets */
      if(ex.t===3&&SMALL.has(ex.m)) sets+=1;
      if(freq<=3) sets+=1;
      if(priorities.includes(muscle)) sets+=1;
      return {ex:ex.id,sets,rl:ex.r[0],rh:ex.r[1],rest:REST[ex.t],rir:RIR[ex.t]};
    }).filter(Boolean);
    return {type,name:DAY_NAMES[type],blocks};
  });
  return {days,createdAt:Date.now(),shape,exp,equipment:p.equipment,daysPerWeek:p.days};
}
/* fractional volume: primary = 1 set, secondary = 0.5 */
function weeklyVolume(plan){
  const v={}; Object.keys(MUSCLES).forEach(m=>v[m]=0);
  plan.days.forEach(d=>d.blocks.forEach(b=>{
    const e=EXBY[b.ex]; if(!e) return;
    v[e.m]=(v[e.m]||0)+b.sets;
    (e.s||[]).forEach(sm=>{ if(v[sm]!=null) v[sm]+=b.sets*0.5; });
  }));
  return v;
}
const SMALL=new Set(['delts_s','delts_r','delts_f','biceps','triceps','calves','abs']);
function volTarget(exp){ return exp==='beginner'?[8,14]:exp==='advanced'?[14,22]:[10,18]; }
/* small muscles carry indirect work from every press and pull, so their direct
   target sits below the whole-muscle-group range the meta-analyses report */
function volTargetFor(muscle,exp){
  const [lo,hi]=volTarget(exp);
  return SMALL.has(muscle)?[Math.round(lo*0.75),Math.round(hi*0.8)]:[lo,hi];
}

function eligibleMeals(p){
  const rank=DIET_RANK[p.diet||'veg'];
  return MEALS.filter(m=>{
    if(DIET_RANK[m.d]>rank) return false;
    if(p.cuisine==='indian' && !m.in) return false;
    if(p.budget && (m.b||2)>2) return false;
    return true;
  });
}
function macrosOf(items){
  let k=0,p=0,c=0,f=0,cost=0;
  items.forEach(([id,g])=>{ const o=F[id]; if(!o) return;
    k+=o.k*g/100; p+=o.p*g/100; c+=o.c*g/100; f+=o.f*g/100; cost+=o.r*g/100; });
  return {k,p,c,f,cost};
}
function buildDay(profile,targets,seed){
  const pool=eligibleMeals(profile);
  /* order candidates by how close they are to how the person actually eats:
     a non-veg eater sees chicken and fish first, a vegetarian sees dairy first */
  const byRank=(a,b)=>DIET_RANK[b.d]-DIET_RANK[a.d];   /* closest to how they eat, first */
  const byCost=(a,b)=>(a.b||2)-(b.b||2);                /* cheapest staples first */
  const bySlot=s=>{ const l=(pool.filter(m=>m.s===s).length?pool:MEALS).filter(m=>m.s===s);
    return l.slice().sort((a,b)=>profile.budget?(byCost(a,b)||byRank(a,b)):(byRank(a,b)||byCost(a,b))); };
  const slots=targets.kcal>2300?['breakfast','lunch','snack','snack','dinner']:['breakfast','lunch','snack','dinner'];
  const chosen=[]; const seen=new Set();
  slots.forEach((s,i)=>{
    const list=bySlot(s);
    let m=null;
    for(let t=0;t<list.length;t++){ const cand=list[(seed+t)%list.length]; if(!seen.has(cand.n)){m=cand;break;} }
    m=m||list[(seed+i)%list.length]; seen.add(m.n);
    chosen.push({tpl:m,items:m.i.map(x=>[x[0],x[1],x[2]])});
  });
  /* three-pass solve: protein → fat → carbs, each clamped to sane portions */
  const roleTotal=(role,key)=>chosen.reduce((a,ml)=>a+ml.items.filter(i=>i[2]===role)
      .reduce((b,i)=>b+(F[i[0]]?.[key]||0)*i[1]/100,0),0);
  const scaleRole=(role,factor)=>chosen.forEach(ml=>ml.items.forEach(i=>{
    if(i[2]===role) i[1]=clamp(i[1]*factor, i[1]*0.45, i[1]*2.6);
  }));
  for(let pass=0;pass<3;pass++){
    const cur=macrosOf(chosen.flatMap(m=>m.items));
    const pRole=roleTotal('p','p'), pOther=cur.p-pRole;
    if(pRole>0) scaleRole('p', clamp((targets.protein-pOther)/pRole,0.5,2.4));
    const c2=macrosOf(chosen.flatMap(m=>m.items));
    const fRole=roleTotal('f','f'), fOther=c2.f-fRole;
    if(fRole>0) scaleRole('f', clamp((targets.fat-fOther)/fRole,0.4,2.6));
    const c3=macrosOf(chosen.flatMap(m=>m.items));
    const cRole=roleTotal('c','k'), kOther=c3.k-cRole;
    if(cRole>0) scaleRole('c', clamp((targets.kcal-kOther)/cRole,0.4,2.6));
  }
  chosen.forEach(m=>m.items.forEach(i=>{ i[1]=Math.max(5,Math.round(i[1]/5)*5); }));
  const totals=macrosOf(chosen.flatMap(m=>m.items));
  return {meals:chosen,totals,seed};
}

/* ---- image compression (max 1024px, JPEG 0.72 — large enough for OCR) ---- */
async function compressImage(file){
  return new Promise(resolve=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const MAX=1024; let w=img.naturalWidth,h=img.naturalHeight;
      if(w>MAX||h>MAX){const s=MAX/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      resolve({base64:c.toDataURL('image/jpeg',0.72).split(',')[1],mimeType:'image/jpeg'});
    };
    img.src=url;
  });
}

/* ---- PDF.js: load CDN library once ---- */
async function loadPdfJs(){
  await new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
    s.onload=res; s.onerror=rej; document.head.appendChild(s);
  });
  window.pdfjsLib.GlobalWorkerOptions.workerSrc=
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
}

/* ---- Render a PDF page to a compressed JPEG (for scanned/image PDFs) ---- */
async function pdfPageToImage(pdfDoc, pageNum){
  const page=await pdfDoc.getPage(pageNum);
  const MAX=1200;
  const raw=page.getViewport({scale:1});
  const scale=Math.min(2.0, MAX/Math.max(raw.width,raw.height));
  const vp=page.getViewport({scale});
  const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
  await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  return c.toDataURL('image/jpeg',0.82).split(',')[1];
}

/* ---- Process PDF: try text first, fall back to rendering page 1 as image ---- */
function extractStructuredText(tc){
  // Group text items by y-position (row detection) using transform[5]
  const items=tc.items.filter(it=>it.str.trim());
  if(!items.length) return '';
  // Round y to nearest 2px to group items on the same line
  const rows=new Map();
  for(const it of items){
    const y=Math.round((it.transform?it.transform[5]:0)/2)*2;
    const x=it.transform?it.transform[4]:0;
    if(!rows.has(y)) rows.set(y,[]);
    rows.get(y).push({x,str:it.str});
  }
  // Sort rows by y descending (PDF y-axis is bottom-up), items by x ascending
  const sortedYs=[...rows.keys()].sort((a,b)=>b-a);
  const lines=[];
  for(const y of sortedYs){
    const row=rows.get(y).sort((a,b)=>a.x-b.x);
    // Insert tab separators when x-gap > 15px to preserve columns
    let line='';
    let prevX=-Infinity;
    for(const item of row){
      const gap=item.x-prevX;
      if(line&&gap>15) line+='\t';
      else if(line&&gap>3) line+=' ';
      line+=item.str;
      prevX=item.x+(item.str.length*5); // approximate end position
    }
    lines.push(line);
  }
  return lines.join('\n');
}

async function processPdf(file){
  if(!window.pdfjsLib) await loadPdfJs();
  const ab=await file.arrayBuffer();
  const pdf=await window.pdfjsLib.getDocument({data:ab}).promise;

  // Attempt structured text extraction (preserves table layout)
  let text='';
  const pagesToScan=Math.min(pdf.numPages,15);
  for(let i=1;i<=pagesToScan;i++){
    const pg=await pdf.getPage(i);
    const tc=await pg.getTextContent();
    text+=extractStructuredText(tc)+'\n\n';
  }
  text=text.trim();

  // If we got meaningful text (>120 chars of non-whitespace), use text mode
  const meaningful=text.replace(/\s+/g,'').length;
  if(meaningful>120){
    return {type:'labs-text',text:text.slice(0,15000)};
  }

  // Scanned/image-based PDF — render first page as JPEG and use vision
  toast('Scanned PDF detected — rendering as image…');
  const base64=await pdfPageToImage(pdf,1);
  return {type:'labs',imageBase64:base64,mimeType:'image/jpeg'};
}

/* ---- fetch with auto-retry on 429 ---- */
async function aiFetch(url,opts,maxRetries=3){
  for(let attempt=0;attempt<=maxRetries;attempt++){
    const r=await fetch(url,opts);
    if(r.status===429&&attempt<maxRetries){
      const wait=Math.min(5+attempt*5,20);
      toast(`AI is busy — retrying in ${wait}s…`);
      await new Promise(ok=>setTimeout(ok,wait*1000));
      continue;
    }
    return r;
  }
}

/* ---- tiny charts (single series, tokenised colours) ---- */
function lineChart(points,{w=320,h=88,unit=''}={}){
  if(points.length<2) return '<p class="tiny muted">Two entries and a line appears here.</p>';
  const xs=points.map((_,i)=>i), ys=points.map(p=>p.v);
  const min=Math.min(...ys), max=Math.max(...ys), pad=(max-min)||1;
  const lo=min-pad*0.18, hi=max+pad*0.18;
  const X=i=>10+(i/(xs.length-1))*(w-20), Y=v=>h-18-((v-lo)/(hi-lo))*(h-30);
  const d=points.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const area=`${d} L${X(xs.length-1).toFixed(1)},${h-18} L${X(0).toFixed(1)},${h-18} Z`;
  const last=points[points.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img"
      aria-label="Trend from ${points[0].v}${unit} on ${points[0].l} to ${last.v}${unit} on ${last.l}">
    <line x1="10" y1="${h-18}" x2="${w-10}" y2="${h-18}" stroke="var(--line)" stroke-width="1"/>
    <path d="${area}" fill="var(--accent)" opacity=".10"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(xs.length-1).toFixed(1)}" cy="${Y(last.v).toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="10" y="${h-5}" font-size="9.5" font-family="IBM Plex Mono,monospace" fill="var(--ink-3)">${esc(points[0].l)}</text>
    <text x="${w-10}" y="${h-5}" text-anchor="end" font-size="9.5" font-family="IBM Plex Mono,monospace" fill="var(--ink-3)">${esc(last.l)}</text>
  </svg>`;
}

function shapeName(plan){
  const t=plan.shape.join(',');
  if(t.includes('upper')) return 'Upper / Lower';
  if(t.includes('push')) return plan.shape.includes('upperA')?'Push \xB7 Pull \xB7 Legs + Upper / Lower':'Push \xB7 Pull \xB7 Legs';
  return 'Full body';
}
function nextDayIndex(){
  if(!S.plan) return 0;
  return S.logs.length % S.plan.days.length;
}
function lastPerf(exId){
  for(let i=S.logs.length-1;i>=0;i--){
    const e=(S.logs[i].entries||[]).find(x=>x.ex===exId);
    if(e){ const done=e.sets.filter(s=>s.done&&s.w!==''&&s.r!==''); if(done.length) return {sets:done,date:S.logs[i].d}; }
  }
  return null;
}
function suggestion(block){
  const lp=lastPerf(block.ex);
  if(!lp) return {text:'First time \u2014 pick a weight you could do '+(block.rh+2)+' times, stop at '+block.rh+'.',bump:false};
  const top=lp.sets[0];
  const allTop=lp.sets.every(s=>Number(s.r)>=block.rh);
  const w=Number(top.w);
  if(allTop&&w) return {text:`Last: ${lp.sets.map(s=>s.w+'\xD7'+s.r).join(', ')} \u2014 add ${w>40?'5':'2.5'} kg today.`,bump:true};
  return {text:`Last: ${lp.sets.map(s=>s.w+'\xD7'+s.r).join(', ')} \u2014 same weight, chase one more rep.`,bump:false};
}
function weekLogs(){
  const now=new Date(); const d=new Date(now); d.setDate(now.getDate()-6);
  const from=d.toISOString().slice(0,10);
  return S.logs.filter(l=>l.d>=from);
}

let restT=null,restLeft=0;
function startSession(idx){
  const day=S.plan.days[idx];
  S.active={startedAt:Date.now(),idx,type:day.type,name:day.name,
    entries:day.blocks.map(b=>({ex:b.ex,plan:b,sets:Array.from({length:b.sets},()=>({w:'',r:'',done:false}))})),notes:''};
  save(); render();
}
function endSession(saveIt){
  if(saveIt){
    const a=S.active;
    const entries=a.entries.map(e=>({ex:e.ex,sets:e.sets.filter(s=>s.done)})).filter(e=>e.sets.length);
    if(!entries.length){ toast('Tick at least one set before finishing.'); return; }
    S.logs.push({id:'l'+Date.now(),d:today(),type:a.type,name:a.name,entries,
      dur:Math.round((Date.now()-a.startedAt)/60000),notes:a.notes});
    toast('Session logged. Nice work.');
  }
  S.active=null; stopRest(); save(); render();
}
function stopRest(){ clearInterval(restT); restT=null; restLeft=0; const b=$('#restBar'); if(b) b.remove(); }
function startRest(sec){
  stopRest(); restLeft=sec;
  const bar=document.createElement('div'); bar.id='restBar';
  bar.style.cssText='position:fixed;left:0;right:0;bottom:calc(61px + env(safe-area-inset-bottom));border-top:1px solid var(--line);z-index:50;background:var(--ink);color:var(--ground);padding:9px 14px;display:flex;align-items:center;gap:12px;justify-content:center;font-family:"IBM Plex Mono",monospace;font-size:13px';
  bar.innerHTML='<span id="restN"></span><button class="btn sm ghost" style="background:transparent;color:inherit;border-color:currentColor" onclick="stopRest()">Skip</button>';
  document.body.appendChild(bar);
  const tick=()=>{ const n=$('#restN'); if(!n) return stopRest();
    n.textContent='Rest '+Math.floor(restLeft/60)+':'+String(restLeft%60).padStart(2,'0');
    if(restLeft<=0){ n.textContent='Rest done \u2014 next set.'; clearInterval(restT); setTimeout(stopRest,3000); } restLeft--; };
  tick(); restT=setInterval(tick,1000);
}
function setVal(ei,si,k,v){ S.active.entries[ei].sets[si][k]=v; save(); }
function toggleSet(ei,si){
  const s=S.active.entries[ei].sets[si];
  s.done=!s.done;
  if(s.done){ if(s.r==='') s.r=String(S.active.entries[ei].plan.rh); startRest(S.active.entries[ei].plan.rest); }
  save(); renderSession();
}
function addSet(ei){ const e=S.active.entries[ei]; e.sets.push({w:e.sets.at(-1)?.w||'',r:'',done:false}); save(); renderSession(); }
function renderSession(){
  const a=S.active, el=$('#dashBody');
  const doneSets=a.entries.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);
  const allSets=a.entries.reduce((n,e)=>n+e.sets.length,0);
  const mins=Math.round((Date.now()-a.startedAt)/60000);
  el.innerHTML=`
  <div class="between" style="margin-bottom:10px">
    <div><div class="eyebrow">In progress \xB7 ${mins} min</div><h1 style="margin-top:3px">${esc(a.name)}</h1></div>
    <span class="pill ${doneSets===allSets?'good':'neutral'}">${doneSets}/${allSets} sets</span>
  </div>
  <div class="meter" style="margin-bottom:12px"><i class="${doneSets===allSets?'good':''}" style="width:${allSets?doneSets/allSets*100:0}%"></i></div>
  <div class="card pad">
  ${a.entries.map((e,ei)=>{
    const ex=EXBY[e.ex], sg=suggestion(e.plan);
    return `<div class="ex">
      <div class="ex-h"><div class="ex-i">${ei+1}</div><div style="min-width:0;flex:1">
        <div class="ex-n">${esc(ex.n)}</div>
        <div class="ex-meta"><span>${e.plan.sets}\xD7${e.plan.rl}\u2013${e.plan.rh}</span><span>RIR ${e.plan.rir}</span><span>rest ${e.plan.rest}s</span></div>
        <div class="tiny ${sg.bump?'':'muted'}" style="margin-top:5px;${sg.bump?'color:var(--good)':''}">${esc(sg.text)}</div>
      </div></div>
      <div class="setgrid" style="margin-top:9px">
        <span class="sn"></span><span class="xtiny muted" style="text-align:center">kg</span><span class="xtiny muted" style="text-align:center">reps</span><span></span>
      </div>
      ${e.sets.map((s,si)=>`<div class="setgrid">
        <span class="sn">${si+1}</span>
        <input type="number" inputmode="decimal" step="0.5" value="${s.w}" aria-label="Weight set ${si+1}" oninput="setVal(${ei},${si},'w',this.value)">
        <input type="number" inputmode="numeric" value="${s.r}" placeholder="${e.plan.rh}" aria-label="Reps set ${si+1}" oninput="setVal(${ei},${si},'r',this.value)">
        <button class="tick" aria-pressed="${s.done}" aria-label="Mark set ${si+1} done" onclick="toggleSet(${ei},${si})">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.4l3.2 3.2L13 5"/></svg></button>
      </div>`).join('')}
      <button class="btn ghost sm" style="margin-top:7px" onclick="addSet(${ei})">+ set</button>
      <div class="ex-cue">${esc(ex.c)}</div>
    </div>`;}).join('')}
  </div>
  <div class="card pad stack" style="margin-top:12px">
    <label class="f"><span class="lb">Session notes</span>
      <textarea rows="2" placeholder="How did it feel today?" oninput="S.active.notes=this.value;save()">${esc(a.notes)}</textarea></label>
    <button class="btn block" onclick="endSession(true)">Finish and log</button>
    <button class="btn ghost block" onclick="if(confirm('Discard this session?'))endSession(false)">Discard</button>
  </div><div style="height:8px"></div>`;
}

const MARKER_CATEGORIES={
  'Blood Sugar':['Glucose','HbA1c','Fasting Glucose','Insulin','HOMA-IR'],
  'Lipids':['Total Cholesterol','LDL','HDL','Triglycerides','VLDL','LDL/HDL Ratio','Total Cholesterol/HDL Ratio'],
  'Thyroid':['TSH','T3','T4','Free T3','Free T4'],
  'Vitamins':['Vitamin D','Vitamin B12','Folate','Iron','Ferritin'],
  'Liver':['SGOT','SGPT','ALT','AST','ALP','GGT','Bilirubin','Albumin','Total Protein'],
  'Kidney':['Creatinine','BUN','Urea','Uric Acid','eGFR'],
  'Hormones':['Testosterone','Estradiol','Cortisol','DHEA','Prolactin','LH','FSH'],
  'Blood Count':['Hemoglobin','RBC','WBC','Platelets','Hematocrit','MCV','MCH','MCHC'],
};

function categorizeMarkers(markers){
  if(!markers||!markers.length) return [];
  const cats=[];
  const used=new Set();
  for(const [catName,keywords] of Object.entries(MARKER_CATEGORIES)){
    const matched=markers.filter(m=>{
      const n=m.name.toLowerCase();
      return keywords.some(k=>n.includes(k.toLowerCase()));
    });
    if(matched.length){
      cats.push({name:catName,markers:matched});
      matched.forEach(m=>used.add(m.name));
    }
  }
  const other=markers.filter(m=>!used.has(m.name));
  if(other.length) cats.push({name:'Other',markers:other});
  return cats;
}

function renderHealth(){
  const el=$('#healthBody');
  if(!S.setup){ el.innerHTML='<div class="card pad stack"><h2>Set up your profile first</h2><p class="tiny muted">Create your profile to start tracking your health.</p><button class="btn" onclick="openProfile()">Set up profile</button></div>'; return; }

  const labs=getLabs();
  const categories=labs?categorizeMarkers(labs.markers):[];
  const flagged=labs?(labs.markers||[]).filter(m=>m.flag!=='normal'):[];

  const healthScore=(()=>{
    if(!labs||!labs.markers||!labs.markers.length) return null;
    const normal=labs.markers.filter(m=>m.flag==='normal').length;
    return Math.round(normal/labs.markers.length*100);
  })();

  el.innerHTML=`
  <div style="margin-bottom:10px"><div class="eyebrow">Health Dashboard</div><h1 style="margin-top:3px">Your Health Markers</h1></div>

  ${healthScore!=null?`<div class="grid3" style="margin-bottom:14px">
    <div class="tile"><span class="k">Health Score</span><span class="v">${healthScore}<small> %</small></span>
      <span class="s">${healthScore>=80?'Excellent':healthScore>=60?'Good':'Needs attention'}</span></div>
    <div class="tile"><span class="k">Total Markers</span><span class="v">${labs.markers.length}</span></div>
    <div class="tile"><span class="k">Flagged</span><span class="v">${flagged.length}</span>
      <span class="s">${flagged.length===0?'All normal':'Needs review'}</span></div>
  </div>`:''}

  ${labsPanelHtml()}

  ${categories.length?`
  <div class="card pad stack" style="margin-top:14px">
    <h2>Markers by Category</h2>
    ${categories.map(cat=>`
      <div class="marker-group">
        <div class="marker-group-head">${esc(cat.name)}</div>
        ${cat.markers.map(m=>`<div class="marker-row">
          <span class="marker-name">${esc(m.name)}</span>
          <span class="marker-val">${esc(String(m.value))} ${esc(m.unit||'')}</span>
          <span class="pill ${m.flag==='high'?'bad':m.flag==='low'?'warn':'good'}" style="margin-left:8px">${esc(m.flag||'\u2014')}</span>
        </div>`).join('')}

  ${labs?`<div class="card pad stack" style="margin-top:14px">

  </div>`:''}

  ${aiChatHtml('health','\u2726 AI Health Analysis','Your AI health analyst will review your lab results and provide personalized recommendations for improving your health markers.')}

}

function regenDiet(shuffle){
  const t=nutritionTargets(S.profile,currentBF());
  if(shuffle) S.dietSeed=(S.dietSeed||0)+1;
  S.dietDay=buildDay(S.profile,t,S.dietSeed||0);
  S.dietDay.targets=t; save();
}

function swapMeal(mi){
  const p=S.profile, cur=S.dietDay.meals[mi].tpl;
  const pool=eligibleMeals(p).filter(m=>m.s===cur.s);
  if(pool.length<2){ toast('No other meal fits these filters yet.'); return; }
  const i=pool.findIndex(m=>m.n===cur.n);
  const next=pool[(i+1+pool.length)%pool.length];
  const t=S.dietDay.targets||nutritionTargets(p,currentBF());
  S.dietDay=buildDay(p,t,S.dietSeed||0);
  S.dietDay.meals[mi]={tpl:next,items:next.i.map(x=>[x[0],x[1],x[2]])};
  const meals=S.dietDay.meals;
  const roleTotal=(role,key)=>meals.reduce((a,ml)=>a+ml.items.filter(i=>i[2]===role).reduce((b,i)=>b+(F[i[0]]?.[key]||0)*i[1]/100,0),0);
  const scaleRole=(role,f)=>meals.forEach(ml=>ml.items.forEach(i=>{ if(i[2]===role) i[1]=clamp(i[1]*f,i[1]*0.45,i[1]*2.6); }));
  for(let pass=0;pass<3;pass++){
    let cur2=macrosOf(meals.flatMap(m=>m.items));
    const pr=roleTotal('p','p'); if(pr>0) scaleRole('p',clamp((t.protein-(cur2.p-pr))/pr,0.5,2.4));
    cur2=macrosOf(meals.flatMap(m=>m.items));
    const fr=roleTotal('f','f'); if(fr>0) scaleRole('f',clamp((t.fat-(cur2.f-fr))/fr,0.4,2.6));
    cur2=macrosOf(meals.flatMap(m=>m.items));
    const cr=roleTotal('c','k'); if(cr>0) scaleRole('c',clamp((t.kcal-(cur2.k-cr))/cr,0.4,2.6));
  }
  meals.forEach(m=>m.items.forEach(i=>i[1]=Math.max(5,Math.round(i[1]/5)*5)));
  S.dietDay.totals=macrosOf(meals.flatMap(m=>m.items));
  S.dietDay.targets=t; save(); renderNutrition();
}

const DEF_MARKS={sh:{y:24,x0:31,x1:69},wa:{y:45,x0:40,x1:60},hi:{y:55,x0:37,x1:63},top:5,bot:96};

function addPhoto(file,view){
  if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=620, sc=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      const src=cv.toDataURL('image/jpeg',0.72);
      const rec={id:'p'+Date.now(),d:today(),view,src,w:cv.width,h:cv.height,marks:structuredClone(DEF_MARKS),derived:null};
      S.photos.push(rec);
      if(S.photos.length>10) S.photos.shift();
      SEL=rec.id; save(); renderProfile();
      toast('Photo added. Drag the markers onto your frame.');
    };
    img.onerror=()=>toast('That file could not be read as an image.');
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}
function computeDerived(ph){
  const m=ph.marks, span=(m.bot-m.top)/100*ph.h;
  if(span<=0) return null;
  const cm=dx=>r1((dx/100*ph.w)/span*S.profile.heightCm);
  const dsh=m.sh.x1-m.sh.x0, dwa=m.wa.x1-m.wa.x0, dhi=m.hi.x1-m.hi.x0;
  if(dsh<=0||dwa<=0||dhi<=0) return null;
  return {sw:r2(dsh/dwa), whip:r2(dwa/dhi), shCm:cm(dsh), waCm:cm(dwa), hiCm:cm(dhi)};
}
function saveMarks(){
  const ph=S.photos.find(p=>p.id===SEL); if(!ph) return;
  ph.derived=computeDerived(ph); save(); renderProfile();
  toast(ph.derived?'Frame measured.':'Move the head and floor markers apart first.');
}
function bindStage(){
  const stage=$('#stage'); if(!stage) return;
  const ph=S.photos.find(p=>p.id===SEL); if(!ph) return;
  let drag=null;
  const pos=e=>{ const r=stage.getBoundingClientRect();
    return {x:clamp((e.clientX-r.left)/r.width*100,0,100), y:clamp((e.clientY-r.top)/r.height*100,0,100)}; };
  stage.addEventListener('pointerdown',e=>{
    const h=e.target.closest('[data-h]'); if(!h) return;
    drag=h.dataset.h; stage.setPointerCapture(e.pointerId); e.preventDefault();
  });
  stage.addEventListener('pointermove',e=>{
    if(!drag) return;
    const {x,y}=pos(e), m=ph.marks;
    if(drag==='top') m.top=clamp(y,0,m.bot-8);
    else if(drag==='bot') m.bot=clamp(y,m.top+8,100);
    else { const [g,i]=[drag.slice(0,2),drag.slice(2)];
      m[g].y=y; m[g]['x'+i]=x;
      if(m[g].x1<m[g].x0+2){ if(i==='1') m[g].x1=m[g].x0+2; else m[g].x0=m[g].x1-2; } }
    drawMarks(ph);
  });
  const up=()=>{ if(drag){ drag=null; save(); } };
  stage.addEventListener('pointerup',up); stage.addEventListener('pointercancel',up);
  drawMarks(ph);
}
function drawMarks(ph){
  const svg=$('#marks'); if(!svg) return;
  const m=ph.marks;
  const bar=(g,label,col)=>{
    const o=m[g];
    return `<line x1="${o.x0}" y1="${o.y}" x2="${o.x1}" y2="${o.y}" stroke="${col}" stroke-width="0.7" vector-effect="non-scaling-stroke"/>
    <text x="${(o.x0+o.x1)/2}" y="${o.y-2.4}" text-anchor="middle" font-size="3.4" font-family="IBM Plex Mono,monospace" fill="${col}" stroke="rgba(0,0,0,.45)" stroke-width="0.7" paint-order="stroke">${label}</text>
    <circle data-h="${g}0" class="hnd" cx="${o.x0}" cy="${o.y}" r="2.6" fill="${col}" stroke="#fff" stroke-width="0.6"/>
    <circle data-h="${g}1" class="hnd" cx="${o.x1}" cy="${o.y}" r="2.6" fill="${col}" stroke="#fff" stroke-width="0.6"/>`;
  };
  const gline=(k,label)=>`<line x1="0" y1="${m[k]}" x2="100" y2="${m[k]}" stroke="#F2C14E" stroke-width="0.5" stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/>
    <circle data-h="${k}" class="hnd" cx="7" cy="${m[k]}" r="2.6" fill="#F2C14E" stroke="#fff" stroke-width="0.6"/>
    <text x="12" y="${m[k]+(k==='top'?-1.6:3.6)}" font-size="3.2" font-family="IBM Plex Mono,monospace" fill="#F2C14E" stroke="rgba(0,0,0,.45)" stroke-width="0.7" paint-order="stroke">${label}</text>`;
  svg.innerHTML=gline('top','crown')+gline('bot','floor')+bar('sh','shoulders','#5CE1E6')+bar('wa','waist','#FF7A6B')+bar('hi','hips','#9BE36D');
}

const CREW={posts:[],ready:false,loaded:false,cap:null,mode:'loading',storage:true,needsCode:false};

async function crewJSON(url,opts){
  const r=await fetch(url,opts||{cache:'no-store'});
  const ct=r.headers.get('content-type')||'';
  if(!ct.includes('json')) throw new Error('not json');
  return {status:r.status,ok:r.ok,body:await r.json()};
}
async function crewInit(){
  let cap=null;
  try{
    cap=await Promise.race([
      claude.use('artifact'),
      new Promise(res=>setTimeout(()=>res(null),2500))
    ]);
  }catch(e){ cap=null; }

  if(cap){
    CREW.cap=cap; CREW.mode='artifact';
    try{ const r=await crewJSON('data/crew.json');
      if(r.ok&&Array.isArray(r.body.posts)) CREW.posts=r.body.posts; }catch(e){}
  }else{
    try{
      const r=await crewJSON('api/crew');
      if(r.ok){
        CREW.posts=Array.isArray(r.body.posts)?r.body.posts:[];
        CREW.storage=r.body.storage!==false;
        CREW.needsCode=!!r.body.passcode;
        CREW.mode='api';
      }
    }catch(e){}
    if(CREW.mode!=='api') CREW.mode='readonly';
  }
  CREW.loaded=true; CREW.ready=true;
  if(VIEW==='profile') renderProfile();
}
function crewBusy(on,label){ const b=$('#crewSend'); if(b){ b.disabled=on; b.textContent=on?(label||'Posting\u2026'):'Post check-in'; } }
async function crewPost(kind){
  const text=($('#crewText')?.value||'').trim();
  const who=($('#crewWho')?.value||'').trim()||S.profile.name||'Anonymous';
  if(!text){ toast('Write something first.'); return; }
  if(text.length>600){ toast('Keep it under 600 characters.'); return; }
  S.handle=who; save();
  const post={id:'c'+Date.now()+Math.random().toString(36).slice(2,6),who:who.slice(0,32),ts:Date.now(),kind,text:text.slice(0,600)};

  if(CREW.mode==='api'){
    if(CREW.needsCode&&!S.crewCode){
      const code=prompt('This board is passcode protected. Enter the passcode to post:');
      if(!code) return;
      S.crewCode=code.trim(); save();
    }
    crewBusy(true);
    try{
      const r=await crewJSON('api/crew',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({who:post.who,text:post.text,kind,code:S.crewCode||''})});
      if(r.ok){
        CREW.posts=Array.isArray(r.body.posts)?r.body.posts:[post,...CREW.posts];
        if($('#crewText')) $('#crewText').value='';
        toast('Posted to the board.');
      }else if(r.status===401){
        S.crewCode=''; save(); toast('Wrong passcode. Try posting again.');
      }else if(r.status===429){
        toast('Easy \u2014 one post a minute.');
      }else if(r.status===503){
        CREW.storage=false; toast('The board store is not connected yet.');
      }else{
        toast(r.body&&r.body.error?r.body.error:'Could not post right now.');
      }
    }catch(e){ toast('Could not reach the board. Check your connection.'); }
    crewBusy(false); renderProfile(); return;
  }

  if(CREW.mode==='artifact'){
    crewBusy(true);
    const next=[post,...CREW.posts].slice(0,200);
    try{
      await CREW.cap.publish({'data/crew.json':JSON.stringify({v:1,posts:next})});
      CREW.posts=next;
      if($('#crewText')) $('#crewText').value='';
      toast('Posted to the board.');
    }catch(err){
      const c=err&&err.code;
      if(c==='conflict') toast('Someone posted at the same time \u2014 reload and try again.');
      else if(c==='not_writer'||c==='not_granted'||c==='capability_disabled'){ CREW.mode='readonly'; toast('This view is read-only.'); }
      else if(c==='rate_limited') toast('Posting too fast \u2014 wait a moment.');
      else toast('Could not post right now.');
    }
    crewBusy(false); renderProfile(); return;
  }
  toast('This copy of the page is read-only.');
}
function lastSessionSummary(){
  const l=S.logs[S.logs.length-1]; if(!l) return '';
  const best=l.entries.map(e=>{ const s=e.sets.reduce((a,b)=>Number(b.w)>Number(a.w)?b:a,e.sets[0]);
    return `${EXBY[e.ex]?.n||e.ex} ${s.w}\xD7${s.r}`; }).slice(0,3).join(', ');
  return `${l.name} done \u2014 ${best}.`;
}
function crewNotice(){
  if(!CREW.ready) return '';
  if(CREW.mode==='api'&&!CREW.storage)
    return '<div class="note">The board is live but its store is not connected yet. Add the Upstash Redis integration to this project on Vercel and redeploy.</div>';
  if(CREW.mode==='readonly')
    return navigator.onLine
      ? '<div class="note">This copy of the page is read-only. Posting works on the deployed site.</div>'
      : '<div class="note">You are offline. The board loads again once you reconnect.</div>';
  if(CREW.mode==='api')
    return '<div class="note">This board is public: anyone who has the link can read and post.</div>';
  return '';
}

  <div class="stack">
    <div class="grid2">
      <label class="f"><span class="lb">Name</span><input type="text" id="f_name" value="${esc(p.name)}" placeholder="Optional"></label>
      <label class="f"><span class="lb">Sex</span><select id="f_sex">
        <option value="male"${p.sex==='male'?' selected':''}>Male</option>
        <option value="female"${p.sex==='female'?' selected':''}>Female</option></select></label>
      <label class="f"><span class="lb">Age</span><input type="number" id="f_age" value="${p.age}"></label>
      <label class="f"><span class="lb">Height (cm)</span><input type="number" id="f_heightCm" value="${p.heightCm}"></label>
      <label class="f"><span class="lb">Weight (kg)</span><input type="number" step="0.1" id="f_weightKg" value="${p.weightKg}"></label>
      <label class="f"><span class="lb">Days per week</span><select id="f_days">${[2,3,4,5,6].map(d=>`<option value="${d}"${p.days===d?' selected':''}>${d} days</option>`).join('')}</select></label>
      <label class="f"><span class="lb">Experience</span><select id="f_experience">
        ${[['beginner','Under a year'],['intermediate','1\u20133 years'],['advanced','3 years plus']].map(([k,l])=>`<option value="${k}"${p.experience===k?' selected':''}>${l}</option>`).join('')}</select></label>
      <label class="f"><span class="lb">Equipment</span><select id="f_equipment">
        ${[['full','Full gym'],['home','Dumbbells at home'],['minimal','Bodyweight + bands']].map(([k,l])=>`<option value="${k}"${p.equipment===k?' selected':''}>${l}</option>`).join('')}</select></label>
      <label class="f"><span class="lb">Goal</span><select id="f_goal">
        ${[['muscle','Build muscle'],['cut','Lose fat'],['recomp','Recomp'],['strength','Get stronger']].map(([k,l])=>`<option value="${k}"${p.goal===k?' selected':''}>${l}</option>`).join('')}</select></label>
      <label class="f"><span class="lb">Daily activity</span><select id="f_activity">
        ${[['desk','Mostly sitting'],['moderate','On and off my feet'],['onfeet','On my feet all day']].map(([k,l])=>`<option value="${k}"${p.activity===k?' selected':''}>${l}</option>`).join('')}</select></label>
      <label class="f"><span class="lb">Diet</span><select id="f_diet">
        ${[['nonveg','Non-vegetarian'],['egg','Egg + vegetarian'],['veg','Vegetarian'],['vegan','Vegan']].map(([k,l])=>`<option value="${k}"${p.diet===k?' selected':''}>${l}</option>`).join('')}</select></label>
      <label class="f"><span class="lb">Cuisine</span><select id="f_cuisine">
        <option value="indian"${p.cuisine==='indian'?' selected':''}>Indian only</option>
        <option value="any"${p.cuisine==='any'?' selected':''}>Anything</option></select></label>
    </div>
    <label class="row" style="gap:8px"><input type="checkbox" id="f_budget" ${p.budget?'checked':''} style="width:auto"><span class="tiny">Budget-friendly food only</span></label>
    <button class="btn block" onclick="saveProfile()">${S.setup?'Save':'Save and build my plan'}</button>
    ${S.setup?`<button class="btn ghost block" onclick="wipe()">Erase all my data</button>`:''}
  </div>`;
  $('#dlg').showModal();
}
function saveProfile(){
  const p=S.profile;
  ['name','sex','experience','equipment','goal','activity','diet','cuisine'].forEach(k=>p[k]=$('#f_'+k).value);
  ['age','heightCm','weightKg'].forEach(k=>p[k]=Number($('#f_'+k).value)||p[k]);
  p.days=Number($('#f_days').value); p.budget=$('#f_budget').checked;
  const first=!S.setup; S.setup=true;
  regenPlan(); S.dietDay=null;
  save(); $('#dlg').close(); show(first?'dashboard':VIEW);
  if(first) toast('Profile saved. Your personalized plans are ready.');
}
function wipe(){ if(!confirm('Erase your profile, logs, photos and measurements from this browser?'))return;
  localStorage.removeItem(KEY); S=structuredClone(DEF); SEL=null; $('#dlg').close(); show('dashboard'); }
$('#dlgX').addEventListener('click',()=>$('#dlg').close());
$('#btnProfile').addEventListener('click',openProfile);
$('#btnTheme').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':cur==='light'?null:'dark';
  if(next) document.documentElement.setAttribute('data-theme',next);
  else document.documentElement.removeAttribute('data-theme');
  S.theme=next; save();
  toast(next?next[0].toUpperCase()+next.slice(1)+' theme':'Following your system theme');
});

/* ---- boot ---- */
load();
if(S.theme) document.documentElement.setAttribute('data-theme',S.theme);
if(S.setup&&!S.plan) regenPlan();
render();
crewInit();

</script>

<script>
  /* Offline app shell. Registered late so it never delays first paint. */
  if ('serviceWorker' in navigator && window.isSecureContext) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
